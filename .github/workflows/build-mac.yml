name: Build Parallax (macOS)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libasound2-dev ninja-build xvfb
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4 --target ParallaxTests PLXTestDrive_VST3 PLXTestLatency_VST3
      - name: Engine tests
        run: xvfb-run -a build/ParallaxTests_artefacts/Release/ParallaxTests "$PWD/build"
  build:
    runs-on: macos-latest      # Apple Silicon runner; builds a Universal binary (arm64 + x86_64)
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ninja || true
      - name: Configure
        run: cmake -S . -B build-mac -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DPLX_BUILD_TESTS=ON
      - name: Build
        run: |
          set -o pipefail
          cmake --build build-mac -j 4 --target Parallax_VST3 ParallaxTests PLXTestDrive_VST3 PLXTestLatency_VST3 2>&1 | tee build.log | grep -E 'error|FAILED' || true
          test -d build-mac/Parallax_artefacts/Release/VST3/Parallax.vst3
      - name: Engine tests
        run: build-mac/ParallaxTests_artefacts/Release/ParallaxTests "$PWD/build-mac" | tee tests.txt
      - name: Package
        run: |
          set -e
          OUT=build-mac/Parallax_artefacts/Release/VST3/Parallax.vst3
          codesign --force --deep --sign - "$OUT"
          lipo -archs "$OUT/Contents/MacOS/Parallax" | tee -a tests.txt
          mkdir -p dist/root/Library/Audio/Plug-Ins/VST3 dist/out
          cp -R "$OUT" dist/root/Library/Audio/Plug-Ins/VST3/
          pkgbuild --root dist/root --scripts installer/scripts --identifier com.parallaxaudio.parallax.vst3 \
                   --version 0.1.0 --install-location / dist/Parallax-Installer.pkg
          cp dist/Parallax-Installer.pkg dist/out/
          cp -R "$OUT" dist/out/
          cp installer/Install-Parallax.command dist/out/
          chmod +x dist/out/Install-Parallax.command
          cp tests.txt dist/out/test-results.txt
          (cd dist/out && zip -qry ../Parallax-mac.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: Parallax-mac
          path: dist/Parallax-mac.zip
      - name: Publish download (release "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Parallax-Installer.pkg dist/Parallax-mac.zip \
             --title "Parallax (latest build)" --notes "Build ${{ github.sha }}. Download Parallax-Installer.pkg and open it." --latest
      - name: Publish result to the build-output branch
        if: always()
        run: |
          mkdir -p /tmp/pub && cd /tmp/pub
          cp "$GITHUB_WORKSPACE"/tests.txt test-results.txt 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/build.log build.log 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > STATUS.txt
          git init -q -b build-output
          git config user.name "Parallax build"; git config user.email "build@parallax.local"
          git add -A && git commit -qm "Build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-output
